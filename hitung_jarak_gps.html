    <style>
        * {

        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        
        /* Gaya untuk Judul Utama (Selalu di Atas) */
        .header-app {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            text-align: center;
        }
        .header-app h2 {
            margin: 0;
            color: #2c3e50;
            font-size: 1.8rem;
            font-weight: 700;
        }
        .header-app p {
            margin: 5px 0 0 0;
            color: #7f8c8d;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Struktur Layout Desktop */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }
        
        /* RESPONSIF UNTUK HP (Ukuran Layar di bawah 768px) */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .header-app h2 {
                font-size: 1.5rem;
            }
            .header-app p {
                font-size: 0.95rem;
            }
            .container {
                display: flex;
                flex-direction: column;
            }
            #map {
                order: 1;
                height: 350px !important;
                margin-bottom: 10px;
            }
            .panel {
                order: 2;
            }
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }
        .search-group {
            display: flex;
            gap: 5px;
        }
        .search-group button {
            width: auto;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
        .search-group button:hover {
            background: #2980b9;
        }
        #map {
            height: 550px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e8f4fd;
            border-left: 5px solid #3498db;
            border-radius: 4px;
            display: none;
        }
        .result-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .distance-val {
            font-size: 1.8rem;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .info-text {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .school-detail {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #bdc3c7;
            font-size: 0.85rem;
            color: #2c3e50;
        }
    </style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const defaultCenter = [-6.5971, 106.7986];
    const map = L.map('map').setView(defaultCenter, 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let markerA = null;
    let markerB = null;
    let distanceLine = null;
    
    let coordA = null;
    let coordB = null;

    map.on('click', function(e) {
        setPointA(e.latlng.lat, e.latlng.lng, "Titik Pilihan Anda");
    });

    function setPointA(lat, lng, label) {
        coordA = [lat, lng];
        document.getElementById('coordInput').value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;

        if (markerA) map.removeLayer(markerA);
        markerA = L.marker(coordA).addTo(map).bindPopup(label).openPopup();
        
        map.panTo(coordA); 
        calculateDistance();
    }

    async function searchAddress() {
        const query = document.getElementById('addressInput').value;
        if (!query) return alert('Silakan masukkan nama tempat atau alamat terlebih dahulu!');

        try {
            const searchQuery = query.toLowerCase().includes('bogor') ? query : query + ', Bogor';
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}`);
            const data = await response.json();

            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                setPointA(lat, lon, data[0].display_name);
            } else {
                alert('Alamat tidak ditemukan. Coba ketik nama tempat yang lebih spesifik.');
            }
        } catch (error) {
            console.error(error);
            alert('Gagal mengambil data alamat.');
        }
    }

    function calculateDistance() {
        const schoolSelect = document.getElementById('schoolSelect');
        const schoolValue = schoolSelect.value;
        
        if (!schoolValue || !coordA) {
            if (distanceLine) map.removeLayer(distanceLine);
            if (markerB) map.removeLayer(markerB);
            document.getElementById('resultBox').style.display = 'none';
            return;
        }

        const [latB, lngB] = schoolValue.split(',').map(Number);
        coordB = [latB, lngB];
        
        const selectedOption = schoolSelect.options[schoolSelect.selectedIndex];
        const schoolName = selectedOption.text;
        const kecamatan = selectedOption.getAttribute('data-kecamatan');
        const alamat = selectedOption.getAttribute('data-alamat');

        if (markerB) map.removeLayer(markerB);
        markerB = L.marker(coordB).addTo(map).bindPopup(`<b>${schoolName}</b><br>${alamat}`);

        const R = 6371; 
        const dLat = deg2rad(coordB[0] - coordA[0]);
        const dLon = deg2rad(coordB[1] - coordA[1]);
        
        const a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(deg2rad(coordA[0])) * Math.cos(deg2rad(coordB[0])) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        const distance = R * c; 

        if (distanceLine) map.removeLayer(distanceLine);
        distanceLine = L.polyline([coordA, coordB], {color: 'red', weight: 3, dashArray: '5, 5'}).addTo(map);
		
		const bounds = L.latLngBounds([coordA, coordB]);
        map.fitBounds(bounds, { padding: [50, 50] });
		
        const distanceInMeter = distance * 1000;
        document.getElementById('distanceOutput').innerText = distanceInMeter.toFixed(2) + ' m';
        document.getElementById('routeInfo').innerText = `Tujuan: ${schoolName}`;
        document.getElementById('schoolDetailOutput').innerHTML = `
            ${alamat}
        `;
        
        document.getElementById('resultBox').style.display = 'block';
    }

    function deg2rad(deg) {
        return deg * (Math.PI/180);
    }
</script>
